<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada · Victor Hideki</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f7f6f3">
<link rel="icon" href="/img/icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<style>
  .erro { min-height: 100vh; display: grid; place-content: center; gap: 18px; padding: 24px; text-align: center; }
  .erro .codigo { margin: 0; font: 700 clamp(64px, 14vw, 120px)/1 var(--mono); letter-spacing: -0.06em; color: var(--acento); }
  .erro h1 { margin: 0; font-size: clamp(24px, 4vw, 34px); letter-spacing: -0.03em; }
  .erro p { margin: 0; color: var(--texto-2); }
  .erro .en { font-size: 15px; color: var(--texto-3); }
  .erro .contatos { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 8px; }
</style>
</head>
<body>
<main class="erro">
  <p class="codigo" aria-hidden="true">404</p>
  <h1>Página não encontrada</h1>
  <p>O endereço pode ter mudado ou estar digitado errado.</p>
  <p class="en" lang="en">Page not found. The address may have changed or been mistyped.</p>
  <div class="contatos">
    <a class="botao" href="/">Voltar ao início</a>
    <a class="botao botao-2" href="/en/" lang="en">English version</a>
  </div>
</main>
</body>
</html>
